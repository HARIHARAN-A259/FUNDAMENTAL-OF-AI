services:
  - type: web
    name: coldguard-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SENSOR_API_KEY
        value: dev-sensor-key

